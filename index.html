<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymond Shop - Login</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:Arial,sans-serif}
.login-box{width:280px;text-align:center;background:rgba(255,255,255,0.95);padding:24px 20px;border:1px solid rgba(204,0,0,0.15);box-shadow:0 20px 60px rgba(0,0,0,0.15);border-radius:8px}
.login-label{color:#CC0000;font-size:13px;font-weight:600;letter-spacing:1.5px;margin-bottom:14px;text-transform:uppercase}
.login-input{width:100%;padding:10px 12px;border:1.5px solid #CC0000;outline:none;font-size:14px;text-align:center;letter-spacing:3px;background:#fff;color:#111;border-radius:4px}
.login-error{color:#CC0000;font-size:11px;margin-top:10px;min-height:14px;display:none;font-weight:600}
.login-error.show{display:block!important}
.login-ok{margin-top:14px;padding:6px 28px;background:#CC0000;color:#fff;border:0;font-weight:700;cursor:pointer;font-size:12px;min-width:75px;border-radius:4px}
</style>
</head>
<body>
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;background:rgba(255,255,255,0.15);backdrop-filter:blur(18px) saturate(180%);">
  <div class="login-box">
    <div class="login-label">Administrator</div>
    <input type="password" id="adminCodeInput" class="login-input" autocomplete="off">
    <div id="loginError" class="login-error">Wrong code! Enter correct code.</div>
    <button class="login-ok" onclick="checkAdminCode()">OK</button>
  </div>
</div>
<script>
const DEFAULT_ADMIN_CODE="Raymond0@.";
function getAdminCode(){return localStorage.getItem('admin_code')||DEFAULT_ADMIN_CODE;}
function checkAdminCode(){
  const el=document.getElementById('adminCodeInput');
  const err=document.getElementById('loginError');
  if(el.value===getAdminCode()){
    localStorage.setItem('raymond_auth','true');
    window.location.href='app/index.html';
  }else{
    err.innerText='Wrong code! Enter correct code.';
    err.classList.add('show');
    el.value=''; el.focus();
  }
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'){checkAdminCode();}});
window.onload=function(){if(localStorage.getItem('raymond_auth')==='true'){window.location.href='app/index.html';}};
</script>
</body>
</html>
