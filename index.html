<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RaymondShop - Cloudflare Ready</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="overlay" class="overlay" onclick="closeSidebar()"></div>

<div id="sidebar" class="sidebar">
  <nav id="nav" class="sidebar-nav"></nav>
</div>

<div class="main">
  <div class="header">
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <img id="headerLogo" class="logo-img" alt="Raymond Logo" src="img/raymond-logo.png" onerror="this.style.display='none'; document.getElementById('headerLogoText').classList.add('show')">
      <div id="headerLogoText" class="logo-text show">RaymondShop</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="font-size:11px;padding:5px 10px;background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a">Cloudflare Ready</div>
    </div>
  </div>
  <div id="content" class="content"></div>
</div>

<div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div>

<div id="appPopup" class="app-popup">
  <div class="app-popup-box">
    <div class="app-popup-header"><span id="popupTitle">Message</span><button onclick="closePopup()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px">×</button></div>
    <div id="popupBody" class="app-popup-body"></div>
    <div id="popupFooter" class="app-popup-footer"><button class="btn" onclick="closePopup()">OK</button></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
