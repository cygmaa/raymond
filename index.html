<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymond Shop - Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;overflow:hidden}
.login-bg{position:fixed;inset:0;background:rgba(255,255,255,0.15);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);z-index:1}
</style>
</head>
<body>
<div class="login-bg"></div>
<div id="loginOverlay" class="show" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;background:rgba(255,255,255,0.15);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);">
  <div class="login-box">
    <div class="login-label">Administrator</div>
    <input type="password" id="adminCodeInput" class="login-input" placeholder="" autocomplete="off">
    <div id="loginError" class="login-error">Wrong code! Enter correct code.</div>
    <button class="login-ok" onclick="checkAdminCode()">OK</button>
    <div style="font-size:10px;color:#888;margin-top:10px">Two-Page Secure Login</div>
  </div>
</div>
<script>
const DEFAULT_ADMIN_CODE="Raymond0@.";
function getAdminCode(){return localStorage.getItem('admin_code')||DEFAULT_ADMIN_CODE;}
function checkAdminCode(){
  const inputEl=document.getElementById('adminCodeInput');
  const error=document.getElementById('loginError');
  const input=inputEl?inputEl.value:'';
  if(input===getAdminCode()){
    localStorage.setItem('raymond_auth','true');
    window.location.href='app/index.html';
  } else {
    if(error){error.innerText='Wrong code! Enter correct code.';error.classList.add('show');}
    if(inputEl){inputEl.value='';inputEl.focus();}
  }
}
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){checkAdminCode();}
  // Block inspect on login page
  if(e.key==='F12' || (e.ctrlKey && e.shiftKey && (e.key==='I' || e.key==='J' || e.key==='C')) || (e.ctrlKey && (e.key==='u' || e.key==='s'))){
    e.preventDefault(); return false;
  }
});
document.addEventListener('contextmenu',function(e){
  const overlay=document.getElementById('loginOverlay');
  if(overlay && overlay.classList.contains('show')){
    const isLogged=localStorage.getItem('raymond_auth')==='true';
    if(!isLogged){e.preventDefault();return false;}
  }
},true);

window.onload=function(){
  const isLogged=localStorage.getItem('raymond_auth')==='true';
  if(isLogged){
    // Already logged in, go directly to app - password page won't show
    window.location.href='app/index.html';
  } else {
    const inp=document.getElementById('adminCodeInput');
    if(inp) setTimeout(()=>inp.focus(),300);
  }
}
</script>
</body>
</html>
